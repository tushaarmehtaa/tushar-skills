schema_version: "1.1"
name: changelog-incomplete-context
description: >-
  The range is genuinely ambiguous: no tag, branch, or window is given, and the
  repo has both a tag and unreleased commits. Tests whether the skill resolves the
  ambiguity honestly instead of silently inventing a range.
tags: [changelog, ambiguous]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
expected_outcome: >-
  Either one focused question about the range, or a labelled provisional changelog
  that states the range it assumed and why. Never a silent, unstated range choice.
