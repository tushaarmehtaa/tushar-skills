schema_version: "1.1"
name: invocation-explicit
description: >-
  Explicit invocation probe. The user names the skill directly. Confirms the
  package loads on demand, in isolation from a personal skill catalog.
tags: [discovery]
runs: 5
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
expected_outcome: The Skill tool is invoked when the user names the skill.
