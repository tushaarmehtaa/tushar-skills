schema_version: "1.1"
name: discovery-release-notes
description: >-
  Automatic discovery probe using "release notes" rather than "changelog". The
  skill description says "release summaries", so this phrasing should match.
tags: [discovery]
runs: 5
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
expected_outcome: The Skill tool is invoked without the user naming the skill.
