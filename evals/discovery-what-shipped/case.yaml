schema_version: "1.1"
name: discovery-what-shipped
description: >-
  Automatic discovery probe using neither "changelog" nor "release notes". This
  is the phrasing furthest from the skill description and the hardest match.
tags: [discovery]
runs: 5
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
expected_outcome: The Skill tool is invoked without the user naming the skill.
