name: Validate Agent Skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install validation dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Build and validate packages
        run: npm run check

      - name: Run site tests
        run: npm --prefix site test --if-present

      - name: Build production site and packages
        run: npm --prefix site run build

      - name: Run browser tests
        run: |
          npm --prefix site exec playwright install --with-deps chromium
          npm --prefix site run test:browser

      - name: Validate build output
        run: npm run validate

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore
